<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maafin Aku 🥹</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ffb6d9, #ffd1e8);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .card {
        width: min(92vw, 600px);
        min-height: 620px;
        background: rgba(255,255,255,.45);
        border-radius: 35px;
        padding: 35px 25px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        box-shadow: 0 15px 40px rgba(180,70,120,.2);
        backdrop-filter: blur(8px);
        position: relative;
    }

    .emoji {
        width: min(290px, 65vw);
        height: min(290px, 65vw);
        object-fit: contain;
        border-radius: 20px;
        margin-bottom: 15px;
    }

    h1 {
        margin: 5px 0 12px;
        color: #b72e70;
        font-size: clamp(30px, 7vw, 48px);
    }

    p {
        color: #8d315f;
        font-size: 20px;
        margin: 5px 0 25px;
        font-weight: bold;
    }

    .buttons {
        display: flex;
        gap: 18px;
        align-items: center;
        justify-content: center;
        min-height: 90px;
        width: 100%;
    }

    button {
        border: none;
        border-radius: 18px;
        padding: 16px 30px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        transition: all .25s ease;
        box-shadow: 0 6px 12px rgba(0,0,0,.12);
    }

    #yes {
        background: #ff4f9a;
        color: white;
        transform-origin: center;
        z-index: 5;
    }

    #no {
        background: white;
        color: #d43b79;
        position: relative;
    }

    .final {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
    }

    .final .emoji {
        width: min(330px, 70vw);
        height: min(330px, 70vw);
    }

    .final h1 {
        font-size: clamp(42px, 10vw, 70px);
        margin: 0 0 5px;
    }

    .final p {
        font-size: clamp(18px, 5vw, 25px);
        margin: 0;
    }

    .heart {
        position: absolute;
        font-size: 25px;
        animation: float 3s infinite ease-in-out;
        opacity: .65;
    }

    @keyframes float {
        0%,100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(10deg); }
    }
</style>
</head>

<script>
let yesScale = 1;
let noCount = 0;

function nope() {
    noCount++;
    yesScale += 0.35;
    document.getElementById("yes").style.transform = `scale(${yesScale})`;

    const no = document.getElementById("no");

    // Tombol ENGGA pindah-pindah
    const maxX = Math.min(170 + noCount * 15, 280);
    const maxY = Math.min(100 + noCount * 10, 190);

    const x = (Math.random() * 2 - 1) * maxX;
    const y = (Math.random() * 2 - 1) * maxY;

    no.style.transform = `translate(${x}px, ${y}px) rotate(${Math.random()*30-15}deg)`;

    // Setelah beberapa kali, IYA jadi sangat besar
    if (yesScale > 3.2) {
        document.getElementById("yes").innerText = "IYAAA 😭💗";
    }
}

function forgive() {
    document.getElementById("question").style.display = "none";
    document.getElementById("final").style.display = "flex";
}
</script>
